<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card" id="info">
    <div class="card__images">
      <img src="img/image-equilibrium.jpg" alt="Equilibrium NFT" class="card__images-img">
      <div class="card__images-layer">
        <img src="img/icon-view.svg" alt="View icon">
      </div>
    </div>

    <div class="card__title" id="card-title">
      <h1><a href="#">Equilibrium #3429</a></h1>
    </div>

    <p class="card__description" id="card-description">Our Equilibrium collection promotes balance and calm.</p>

    <div class="card__time">
      <div class="card__time-left">
        <img src="img/icon-ethereum.svg" alt="ETH icon">
        <span>0.041 ETH</span>
      </div>
      <div class="card__time-right">
        <img src="img/icon-clock.svg" alt="Clock icon">
        <span>3 days left</span>
      </div>
    </div>

    <hr class="card__divider">

    <div class="card__creator">
      <img src="img/qq.jpg" alt="Zeeshan Husain" class="card__creator-img">
      <p>Creation of <a href="#">Zeeshan Husain</a></p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio.do</a>. 
    Coded by <a href="https://www.github.com/zeeshanhusain29" target="_blank" rel="noopener noreferrer">Zeeshan Husain</a>.
  </footer>

</body>
</html>
